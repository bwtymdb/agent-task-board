name: 功能建议
description: 提出新的使用场景或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述实际工作场景，而不只是希望增加的按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果涉及平台接入，请提供公开、稳定接口的依据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括利用现有功能解决的方式。
  - type: textarea
    id: privacy
    attributes:
      label: 隐私和权限影响
      description: 是否需要新数据、写入权限、账号授权或网络访问？没有则写“无新增权限”。
    validations:
      required: true
